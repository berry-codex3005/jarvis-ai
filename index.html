<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061421">
<title>JARVIS AI</title>
<style>
:root{--accent:#00d9ff;--glow:rgba(0,217,255,.4);--panel:rgba(7,25,43,.9);--text:#e8faff}
body.red{--accent:#ff3455;--glow:rgba(255,52,85,.45);--panel:rgba(40,8,20,.9)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:Arial,sans-serif;background:radial-gradient(ellipse at center,#102c43,#061421 75%);transition:.4s}
body.red{background:radial-gradient(ellipse at center,#401020,#180710 75%)}
button,input{font:inherit}button{cursor:pointer}
.app{max-width:850px;margin:auto;padding:15px}
.topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--glow);padding:12px 3px}
.brand{font-size:23px;font-weight:bold;letter-spacing:4px;color:var(--accent);text-shadow:0 0 12px var(--glow)}
.subtitle{font-size:9px;letter-spacing:2px;color:#91aaba;margin-top:5px}
.status{color:var(--accent);font-size:10px;text-align:right}
.profile{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:9px 12px;font-size:20px}
.menu{display:none;position:absolute;right:18px;top:75px;z-index:10;width:260px;padding:17px;background:#091a2a;border:1px solid var(--accent);border-radius:12px;box-shadow:0 0 20px var(--glow)}
body.red .menu{background:#210a14}.menu.show{display:block}
.menu input{width:100%;padding:10px;margin:8px 0;background:#061421;border:1px solid var(--glow);border-radius:7px;color:white}
.menu button{width:100%;padding:10px;margin-top:7px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:7px}
.title{font-size:11px;letter-spacing:2px;color:var(--accent);margin:23px 0 12px}
.reactor-area{display:flex;justify-content:center;align-items:center;padding:15px 0}
.reactor{width:190px;height:190px;border:2px solid var(--accent);border-radius:50%;padding:0;background:#000;overflow:hidden;box-shadow:0 0 15px var(--accent),0 0 35px var(--glow),0 0 65px var(--glow);animation:pulse 2.5s infinite}
.reactor img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;border-radius:50%;background:#000}
body.red .reactor img{filter:hue-rotate(125deg) saturate(1.5)}
@keyframes pulse{50%{box-shadow:0 0 25px var(--accent),0 0 55px var(--glow),0 0 80px var(--glow)}}
.mode{text-align:center;color:var(--accent);font-size:10px;letter-spacing:2px;margin-bottom:22px}
.panel{background:var(--panel);border:1px solid var(--glow);border-radius:12px;padding:15px}
.chat{height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:10px 2px}
.message{max-width:88%;padding:11px;border-radius:10px;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:rgba(0,125,255,.2);border:1px solid rgba(0,125,255,.5)}
.bot{align-self:flex-start;background:rgba(0,217,255,.07);border:1px solid var(--glow)}
.composer{display:flex;gap:8px;border-top:1px solid var(--glow);padding-top:12px}
.composer input{flex:1;min-width:0;background:#061421;border:1px solid var(--glow);border-radius:9px;color:white;padding:12px;outline:none}
.action{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:9px;padding:10px 14px}
.action:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick{background:var(--panel);border:1px solid var(--glow);color:var(--accent);border-radius:11px;min-height:85px;padding:12px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.quick span{font-size:23px}
.hud-icon {
  width:32px;
  height:32px;
  display:block;
  fill:none;
  stroke:var(--accent);
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 5px var(--glow));
}
.quick:hover .hud-icon {
  filter:drop-shadow(0 0 9px var(--accent));
}
.voice-buttons{display:flex;gap:10px;margin-top:10px}.voice-buttons button{flex:1}
.footer{text-align:center;color:#718b9c;font-size:9px;letter-spacing:2px;padding:25px 0 15px}
@media(max-width:400px){.brand{font-size:19px}.chat{height:250px}.reactor{width:165px;height:165px}}
</style>
</head>

<div><div class="brand">J.A.R.V.I.S.</div><div class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</div></div>

<script>
(() => {
  function initJarvis() {
    const $ = (id) => document.getElementById(id);
    const DEFAULT_BACKEND = "https://jarvis-ai-boq0.onrender.com";
    let backend = DEFAULT_BACKEND;
    let lastReply = "";
    let recognition = null;

    const status = (value) => { if ($("status")) $("status").textContent = value; };
    const addMessage = (text, type = "bot") => {
      const messages = $("messages");
      if (!messages) return null;
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    };

    try { backend = localStorage.getItem("jarvisBackend") || DEFAULT_BACKEND; } catch (_) {}
    if ($("backendUrl")) $("backendUrl").value = backend;

    function extractReply(data) {
      if (typeof data === "string") return data.trim();
      for (const key of ["answer", "reply", "response", "message", "text"]) {
        if (typeof data?.[key] === "string" && data[key].trim()) return data[key].trim();
      }
      const parts = data?.candidates?.[0]?.content?.parts;
      if (Array.isArray(parts)) return parts.map(p => p.text || "").join("\n").trim();
      return "";
    }

    async function sendMessage(rawMessage) {
      const message = String(rawMessage || "").trim();
      if (!message) { status("ENTER A MESSAGE"); return; }
      addMessage("YOU: " + message, "user");
      if ($("userInput")) $("userInput").value = "";
      const send = $("sendButton");
      if (send) send.disabled = true;
      status("AI THINKING");
      const loading = addMessage("JARVIS is processing...", "bot");
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 90000);
        let response;
        try {
          response = await fetch(backend.replace(/\/+$/, "") + "/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message,
              mode: document.body.classList.contains("red") ? "red" : "blue"
            }),
            signal: controller.signal
          });
        } finally { clearTimeout(timeout); }
        const raw = await response.text();
        let data;
        try { data = JSON.parse(raw); }
        catch (_) { throw new Error("The server returned an unreadable response (HTTP " + response.status + ")."); }
        if (!response.ok) throw new Error(data.error || "Server error HTTP " + response.status);
        const reply = extractReply(data);
        if (!reply) throw new Error("The server responded, but no answer text was received.");
        if (loading) loading.remove();
        addMessage("J.A.R.V.I.S.: " + reply, "bot");
        lastReply = reply;
        status("SYSTEM READY");
      } catch (error) {
        if (loading) loading.remove();
        const detail = error.name === "AbortError" ? "AI request timed out. Please try again." : error.message;
        addMessage("SYSTEM ERROR: " + detail, "bot");
        status("CONNECTION ERROR");
      } finally { if (send) send.disabled = false; }
    }

    function startVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { addMessage("Voice recognition is not supported in this browser. Try Chrome."); status("VOICE NOT SUPPORTED"); return; }
      try {
        if (recognition) recognition.stop();
        recognition = new SpeechRecognition();
        recognition.lang = "en-IN";
        recognition.interimResults = false;
        recognition.onstart = () => status("LISTENING — SPEAK NOW");
        recognition.onresult = (event) => {
          const spoken = event.results?.[0]?.[0]?.transcript || "";
          if ($("userInput")) $("userInput").value = spoken;
          sendMessage(spoken);
        };
        recognition.onerror = (event) => { status("VOICE ERROR"); addMessage("Voice error: " + (event.error || "Please check microphone permission.")); };
        recognition.onend = () => { if ($("status")?.textContent.startsWith("LISTENING")) status("SYSTEM READY"); };
        recognition.start();
      } catch (error) { addMessage("Could not start microphone: " + error.message); status("VOICE ERROR"); }
    }

    function speakReply() {
      if (!lastReply) { addMessage("There is no JARVIS reply to read aloud yet."); return; }
      if (!("speechSynthesis" in window)) { addMessage("Speech output is not supported in this browser."); return; }
      window.speechSynthesis.cancel();
      const speech = new SpeechSynthesisUtterance(lastReply);
      speech.lang = "en-IN";
      speech.rate = 1;
      window.speechSynthesis.speak(speech);
      status("SPEAKING REPLY");
      speech.onend = () => status("SYSTEM READY");
    }

    // Use one delegated click handler so every lower control responds reliably.
    document.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.id === "reactorButton") {
        document.body.classList.toggle("red");
        const red = document.body.classList.contains("red");
        if ($("modeLabel")) $("modeLabel").textContent = red ? "RED MODE · DEEP THINKING" : "BLUE MODE · SYSTEM ONLINE";
        status(red ? "RED MODE ACTIVE" : "BLUE MODE ACTIVE");
      } else if (button.id === "profileButton") {
        $("profileMenu")?.classList.toggle("show");
      } else if (button.id === "saveBackend") {
        const value = ($("backendUrl")?.value || "").trim().replace(/\/+$/, "");
        if (!/^https:\/\//i.test(value) && !/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(value)) {
          addMessage("Please enter a valid HTTPS backend address."); return;
        }
        backend = value;
        try { localStorage.setItem("jarvisBackend", backend); } catch (_) {}
        $("profileMenu")?.classList.remove("show");
        addMessage("Backend address saved.");
        status("BACKEND SAVED");
      } else if (button.id === "clearChat") {
        if (window.confirm("Clear all chat messages?")) {
          if ($("messages")) $("messages").innerHTML = "";
          lastReply = "";
          addMessage("Chat cleared. Systems ready.");
          status("SYSTEM READY");
        }
        $("profileMenu")?.classList.remove("show");
      } else if (button.id === "voiceButton") {
        startVoice();
      } else if (button.id === "stopButton") {
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        if (recognition) { try { recognition.stop(); } catch (_) {} }
        status("SYSTEM READY");
        addMessage("Voice functions stopped.");
      } else if (button.id === "speakButton") {
        speakReply();
      } else if (button.id === "searchButton") {
        const query = window.prompt("What do you want to search?");
        if (query && query.trim()) {
          const url = "https://www.google.com/search?q=" + encodeURIComponent(query.trim());
          window.open(url, "_blank", "noopener");
          status("OPENING WEB SEARCH");
        }
      } else if (button.hasAttribute("data-prompt")) {
        sendMessage(button.getAttribute("data-prompt"));
      }
    });

    const form = $("chatForm");
    if (form) form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage($("userInput")?.value || "");
    });

    status("SYSTEM READY");
    console.log("JARVIS controls initialized");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initJarvis, { once: true });
  } else {
    initJarvis();
  }
})();
</script>
</body>
</html>
